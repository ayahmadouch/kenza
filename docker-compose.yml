name: kenza

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-kenza}:${POSTGRES_PASSWORD:-kenza}@postgres:5432/${POSTGRES_DB:-kenza}
  REDIS_URL: redis://redis:6379
  DATA_DIR: /app/data
  TZ: ${SHOP_TZ:-Africa/Casablanca}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kenza}
      POSTGRES_DB: ${POSTGRES_DB:-kenza}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kenza} -d ${POSTGRES_DB:-kenza}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # API Fastify + graphe LangGraph. Applique le schéma et seede automatiquement (idempotent, FAIL FAST).
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports: ["${API_PORT:-4000}:4000"]
    volumes: ["./data:/app/data:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Worker BullMQ séparé : relances de paniers abandonnés (jamais de setTimeout dans l'API).
  worker:
    build: { context: ., dockerfile: packages/worker/Dockerfile }
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *app-env
    volumes: ["./data:/app/data:ro"]
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-4000}
    ports: ["${WEB_PORT:-5173}:5173"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
